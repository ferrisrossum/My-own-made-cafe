<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Achtergrondruis Mixer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7e7d6;
      font-family: 'Georgia', serif;
      color: #2b1a0e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 1. Vallende bladeren animatie */
    .leaf-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .leaf {
      position: absolute;
      top: -10%;
      font-size: 1.5rem;
      opacity: 0.7;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* 2. Spotify-speler linksboven */
    .spotify-card {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 10;
      width: 320px;
      padding: 8px;
      background: rgba(255, 248, 240, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.08);
    }

    /* 3. Timer bovenaan in het midden */
    .timer-card {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 248, 240, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 15px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.08);
    }

    .timer-display {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .timer-buttons button {
      background: #2b1a0e;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      margin: 0 2px;
    }

    .timer-buttons button:hover {
      opacity: 0.85;
    }

    /* 4. Oorspronkelijke grote Geluidsmixer in het midden */
    .mixer-container {
      position: relative;
      z-index: 5;
      background: rgba(255, 248, 240, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(210, 180, 150, 0.5);
      border-radius: 24px;
      padding: 35px;
      width: 100%;
      max-width: 460px;
      margin-top: 90px; /* Ruimte voor de timer bovenaan */
      box-shadow: 0 12px 30px rgba(61, 35, 20, 0.08);
    }

    .top-options {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .sound-track {
      margin-bottom: 18px;
    }

    .track-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 1.05rem;
    }

    .play-btn {
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      color: #2b1a0e;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volume-icon {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .slider {
      flex-grow: 1;
      accent-color: #2b1a0e;
      cursor: pointer;
    }

    .pan-row {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .pan-row.active {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- Achtergrond met vallende bladeren -->
  <div class="leaf-container" id="leaf-container"></div>

  <!-- Spotify Speler Links Boven -->
  <div class="spotify-card">
    <iframe 
      style="border-radius:16px;" 
      src="https://open.spotify.com/embed/playlist/7B96Vh6gmhWmGTRzZDMpxd?utm_source=generator&theme=0" 
      width="100%" 
      height="352" 
      frameBorder="0" 
      allowfullscreen="" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>
  </div>

  <!-- Timer Midden Boven -->
  <div class="timer-card">
    <div class="timer-display" id="timer">25:00</div>
    <div class="timer-buttons">
      <button onclick="setTimer(5)">5m</button>
      <button onclick="setTimer(15)">15m</button>
      <button onclick="setTimer(25)">25m</button>
      <button id="start-btn" onclick="toggleTimer()">Start</button>
    </div>
  </div>

  <!-- Geluidsmixer Centraal -->
  <div class="mixer-container">
    <div class="top-options">
      <label class="option-label">
        <span>show pan controls</span>
        <input type="checkbox" id="toggle-pan">
      </label>
      <label class="option-label">
        <span>save preferences</span>
        <input type="checkbox" id="save-pref">
      </label>
    </div>

    <!-- Spoor 1: Barista -->
    <div class="sound-track">
      <div class="track-header">
        <span>Barista 👤</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>

    <!-- Spoor 2: Preparing Drinks -->
    <div class="sound-track">
      <div class="track-header">
        <span>Preparing Drinks</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>

    <!-- Spoor 3: Coffee Cups -->
    <div class="sound-track">
      <div class="track-header">
        <span>Coffee Cups</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>

    <!-- Spoor 4: Other Customers -->
    <div class="sound-track">
      <div class="track-header">
        <span>Other Customers</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>

    <!-- Spoor 5: Machinery -->
    <div class="sound-track">
      <div class="track-header">
        <span>Machinery</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>

    <!-- Spoor 6: Rainy Day -->
    <div class="sound-track">
      <div class="track-header">
        <span>Rainy Day</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>

    <!-- Spoor 7: Sunny Day -->
    <div class="sound-track">
      <div class="track-header">
        <span>Sunny Day</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>

    <!-- Spoor 8: Fireplace -->
    <div class="sound-track">
      <div class="track-header">
        <span>Fireplace</span>
        <button class="play-btn" onclick="togglePlay(this)">▶</button>
      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
        <span>R</span>
      </div>
    </div>
  </div>

  <script>
    // 1. Vallende bladeren genereren
    const leafContainer = document.getElementById('leaf-container');
    const leafIcons = ['🍂', '🍁', '🍃'];
    
    for (let i = 0; i < 20; i++) {
      const leaf = document.createElement('div');
      leaf.classList.add('leaf');
      leaf.textContent = leafIcons[Math.floor(Math.random() * leafIcons.length)];
      leaf.style.left = Math.random() * 100 + 'vw';
      leaf.style.animationDuration = (Math.random() * 8 + 6) + 's';
      leaf.style.animationDelay = Math.random() * 5 + 's';
      leaf.style.fontSize = (Math.random() * 0.8 + 1) + 'rem';
      leafContainer.appendChild(leaf);
    }

    // 2. Play/Pause knoppen
    function togglePlay(btn) {
      btn.textContent = btn.textContent === '▶' ? '⏸' : '▶';
    }

    // 3. Pan Controls Toggle
    const panCheckbox = document.getElementById('toggle-pan');
    const panRows = document.querySelectorAll('.pan-row');

    panCheckbox.addEventListener('change', () => {
      panRows.forEach(row => {
        if (panCheckbox.checked) {
          row.classList.add('active');
        } else {
          row.classList.remove('active');
        }
      });
    });

    // 4. Timer Functionaliteit
    let timerInterval = null;
    let totalSeconds = 25 * 60;
    let isRunning = false;

    function updateDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      document.getElementById('timer').textContent = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function setTimer(minutes) {
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('start-btn').textContent = 'Start';
      totalSeconds = minutes * 60;
      updateDisplay();
    }

    function toggleTimer() {
      const startBtn = document.getElementById('start-btn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Start';
      } else {
        isRunning = true;
        startBtn.textContent = 'Pauze';
        timerInterval = setInterval(() => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'Start';
            alert('Tijd is om!');
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
