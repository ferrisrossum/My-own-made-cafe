<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Achtergrondruis Mixer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5e6d3;
      background-image: radial-gradient(#ead3bb 15%, transparent 16%), radial-gradient(#f5e6d3 15%, transparent 16%);
      background-size: 60px 60px;
      font-family: 'Segoe UI', Georgia, serif;
      height: 100vh;
      color: #3d2314;
      overflow: hidden; /* Voorkomt scrollen */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    /* 1. Canvas voor vallende bladeren */
    #leaves-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 2. Grid-indeling: Drie kolommen (Spotify | Timer | Geluiden) */
    .main-layout {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      gap: 20px;
      width: 100%;
      max-width: 1280px;
      height: calc(100vh - 40px);
      z-index: 10;
      position: relative;
      align-items: start;
    }

    /* Links: Spotify Card */
    .spotify-card {
      background: rgba(255, 248, 240, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.08);
    }

    /* Midden: Timer Card */
    .center-panel {
      display: flex;
      justify-content: center;
    }

    .timer-card {
      background: rgba(255, 248, 240, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 15px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .timer-display {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }

    .timer-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-input {
      width: 45px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #c09f80;
      background: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      text-align: center;
      font-weight: bold;
      color: #3d2314;
    }

    .btn {
      background: #8c4320;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #703317;
    }

    .btn-secondary {
      background: rgba(61, 35, 20, 0.15);
      color: #3d2314;
    }

    /* Rechts: Geluidsmixer (Transparante achtergrond) */
    .mixer-container {
      background: transparent; /* Volledig transparant */
      border: none;
      box-shadow: none;
      padding: 0 5px;
      width: 100%;
      max-height: calc(100vh - 50px);
      overflow-y: auto;
    }

    /* Subtiele/onzichtbare scrollbar als het scherm erg klein is */
    .mixer-container::-webkit-scrollbar {
      width: 4px;
    }
    .mixer-container::-webkit-scrollbar-thumb {
      background: rgba(61, 35, 20, 0.2);
      border-radius: 4px;
    }

    .top-options {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 0.75rem;
      margin-bottom: 10px;
      opacity: 0.85;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .sound-track {
      margin-bottom: 8px;
    }

    .track-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .play-btn {
      background: none;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      color: #3d2314;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-icon {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .slider {
      flex-grow: 1;
      accent-color: #3d2314;
      cursor: pointer;
    }

    .pan-row {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 0.65rem;
      opacity: 0.75;
    }

    .pan-row.active {
      display: flex;
    }

    /* 3. Status Bar Rechts onderin */
    .status-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 248, 240, 0.75);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>

  <!-- Canvas voor Bladeren -->
  <canvas id="leaves-canvas"></canvas>

  <!-- Hoofdindeling van de pagina -->
  <div class="main-layout">
    
    <!-- Linkerkolom: Spotify -->
    <div class="spotify-card">
      <iframe 
        style="border-radius:14px;" 
        src="https://open.spotify.com/embed/playlist/7B96Vh6gmhWmGTRzZDMpxd?utm_source=generator&theme=0" 
        width="200%" 
        height="152" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </div>

    <!-- Middenkolom: Timer -->
    <div class="center-panel">
      <div class="timer-card">
        <div class="timer-display" id="timer">00:00</div>
        <div class="timer-controls">
          <input type="number" id="hours-input" class="timer-input" min="0" max="24" value="0">
          <span style="font-size: 0.8rem; font-weight: 600;">uur</span>
          <input type="number" id="minutes-input" class="timer-input" min="0" max="59" value="5">
          <span style="font-size: 0.8rem; font-weight: 600;">min</span>
          <button class="btn" id="start-btn">Start</button>
          <button class="btn btn-secondary" id="reset-btn">Reset</button>
        </div>
      </div>
    </div>

    <!-- Rechterkolom: Geluidsmixer (Transparant) -->
    <div class="mixer-container">
      <div class="top-options">
        <label class="option-label">
          <span>show pan controls</span>
          <input type="checkbox" id="toggle-pan">
        </label>
        <label class="option-label">
          <span>save preferences</span>
          <input type="checkbox" id="save-pref">
        </label>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Barista 👤</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Preparing Drinks ☕</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Coffee Cups 🍽</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Other Customers 👥</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Machinery ⚙</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Rainy Day 🌧</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Sunny Day ☀️</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>

      <div class="sound-track">
        <div class="track-header">
          <span>Fireplace 🔥</span>
          <button class="play-btn" onclick="togglePlay(this)">▶</button>
        </div>
        <div class="controls-row">
          <span class="volume-icon">🔊</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
        <div class="pan-row">
          <span>L</span>
          <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">
          <span>R</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Status Bar Rechts onderin -->
  <div class="status-bar">
    🍂 Stapel vol: <span id="leaf-count">0</span>%
  </div>

  <script>
    // 1. Play / Pause knoppen toggle
    function togglePlay(btn) {
      btn.textContent = btn.textContent === '▶' ? '⏸' : '▶';
    }

    // 2. Pan Controls Toggle
    const panCheckbox = document.getElementById('toggle-pan');
    const panRows = document.querySelectorAll('.pan-row');

    panCheckbox.addEventListener('change', () => {
      panRows.forEach(row => {
        if (panCheckbox.checked) {
          row.classList.add('active');
        } else {
          row.classList.remove('active');
        }
      });
    });

    // 3. Timer Logica
    let totalTime = 300;
    let timeRemaining = totalTime;
    let timerInterval = null;
    let isRunning = false;

    const timerElement = document.getElementById('timer');
    const hoursInput = document.getElementById('hours-input');
    const minutesInput = document.getElementById('minutes-input');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const leafCountElement = document.getElementById('leaf-count');

    function updateTimerDisplay() {
      const hrs = Math.floor(timeRemaining / 3600).toString().padStart(2, '0');
      const mins = Math.floor((timeRemaining % 3600) / 60).toString().padStart(2, '0');
      const secs = (timeRemaining % 60).toString().padStart(2, '0');
      
      if (Math.floor(timeRemaining / 3600) > 0) {
        timerElement.textContent = `${hrs}:${mins}:${secs}`;
      } else {
        timerElement.textContent = `${mins}:${secs}`;
      }
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Start';
        return;
      }

      if (timeRemaining <= 0) resetTimer();

      isRunning = true;
      startBtn.textContent = 'Pauze';

      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = 'Start';
      
      const inputHrs = parseInt(hoursInput.value) || 0;
      const inputMins = parseInt(minutesInput.value) || 0;
      
      totalTime = (inputHrs * 3600) + (inputMins * 60);

      if (totalTime <= 0) {
        totalTime = 60;
        hoursInput.value = 0;
        minutesInput.value = 1;
      }

      timeRemaining = totalTime;
      updateTimerDisplay();
    }

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);
    hoursInput.addEventListener('change', resetTimer);
    minutesInput.addEventListener('change', resetTimer);

    // 4. Canvas Vallende Bladeren Animatie
    const canvas = document.getElementById('leaves-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const leafColors = ['#d8572a', '#e88a1a', '#c0392b', '#f39c12', '#a04000', '#7e5109'];
    const leaves = [];
    const MAX_LEAVES = 70;

    for (let i = 0; i < MAX_LEAVES; i++) {
      leaves.push({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 14 + 10,
        speedY: Math.random() * 1.5 + 0.8,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 2.5,
        color: leafColors[Math.floor(Math.random() * leafColors.length)],
        type: Math.floor(Math.random() * 2)
      });
    }

    const pileLeaves = [];
    for (let i = 0; i < 250; i++) {
      pileLeaves.push({
        xRel: Math.random(),
        yRel: Math.random(),
        size: Math.random() * 16 + 12,
        angle: Math.random() * 360,
        color: leafColors[Math.floor(Math.random() * leafColors.length)]
      });
    }

    function drawLeaf(x, y, size, angle, color, type) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((angle * Math.PI) / 180);
      ctx.fillStyle = color;
      ctx.beginPath();
      
      if (type === 1) {
        ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
        ctx.arc(size / 3, -size / 3, size / 3, 0, Math.PI * 2);
        ctx.arc(-size / 3, -size / 3, size / 3, 0, Math.PI * 2);
      } else {
        ctx.ellipse(0, 0, size, size / 2, 0, 0, Math.PI * 2);
      }
      
      ctx.fill();
      ctx.restore();
    }

    function updateAnimation() {
      ctx.clearRect(0, 0, width, height);

      const progress = 1 - (timeRemaining / totalTime);
      const pileHeight = progress * (height * 0.35);

      leafCountElement.textContent = Math.round(progress * 100);

      if (pileHeight > 0) {
        pileLeaves.forEach(pLeaf => {
          const px = pLeaf.xRel * width;
          const py = height - (pLeaf.yRel * pileHeight);
          drawLeaf(px, py, pLeaf.size, pLeaf.angle, pLeaf.color, 0);
        });
      }

      leaves.forEach(leaf => {
        if (isRunning && timeRemaining > 0) {
          leaf.y += leaf.speedY;
          leaf.x += Math.sin(leaf.y / 25) * 1.2;
          leaf.angle += leaf.spin;

          if (leaf.y >= height - pileHeight) {
            leaf.y = -20;
            leaf.x = Math.random() * width;
          }
        }
        drawLeaf(leaf.x, leaf.y, leaf.size, leaf.angle, leaf.color, leaf.type);
      });

      requestAnimationFrame(updateAnimation);
    }

    resetTimer();
    updateAnimation();
  </script>
</body>
</html>
