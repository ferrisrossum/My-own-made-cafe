<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Ambience Mixer</title>
  <style>
    :root {
      --bg-color: #2b211b;
      --card-bg: rgba(61, 47, 37, 0.85);
      --accent: #d4a373;
      --text: #fefae0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #leaf-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .leaf {
      position: absolute;
      top: -10%;
      color: #c27d38;
      opacity: 0.7;
      font-size: 1.5rem;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { margin-bottom: 5px; }
    p.subtitle { color: var(--accent); margin-bottom: 20px; }

    .top-widgets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      margin-bottom: 25px;
    }

    .card-widget {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      backdrop-filter: blur(5px);
    }

    .card-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .timer-display {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 2px;
      margin: 5px 0 10px 0;
    }

    .timer-inputs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-bottom: 12px;
    }

    .timer-inputs input {
      width: 50px;
      padding: 6px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--bg-color);
      color: var(--text);
      font-weight: bold;
    }

    .timer-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      background-color: var(--accent);
      color: var(--bg-color);
      border: none;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      background-color: #e6b88a;
    }

    .btn-main {
      padding: 12px 28px;
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
      backdrop-filter: blur(5px);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="leaf-container"></div>

  <div class="content-wrapper">
    <h1>Café Soundboard</h1>
    <p class="subtitle">Focus, Muziek & Achtergrondgeluiden</p>

    <div class="top-widgets">
      <!-- Timer met Uren, Minuten en Seconden -->
      <div class="card-widget">
        <div class="card-title">Timer</div>
        <div class="timer-display" id="timerDisplay">00:25:00</div>
        
        <div class="timer-inputs">
          <input type="number" id="inputHours" min="0" max="99" value="0" placeholder="UU"> u
          <input type="number" id="inputMinutes" min="0" max="59" value="25" placeholder="MM"> m
          <input type="number" id="inputSeconds" min="0" max="59" value="0" placeholder="SS"> s
          <button onclick="setCustomTimer()">Stel In</button>
        </div>

        <div class="timer-buttons">
          <button onclick="toggleTimer()" id="timerToggleBtn">Start Timer</button>
          <button onclick="resetTimer()">Reset</button>
        </div>
      </div>

      <!-- Spotify Player -->
      <div class="card-widget" style="padding: 15px;">
        <div class="card-title">Spotify Muziek</div>
        <iframe 
          style="border-radius:12px;" 
          src="https://open.spotify.com/embed/playlist/37i9dQZF1DX4WYpd314L2E?utm_source=generator&theme=0" 
          width="100%" 
          height="152" 
          frameBorder="0" 
          allowfullscreen="" 
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
          loading="lazy">
        </iframe>
      </div>
    </div>

    <!-- Hoofdbediening Audio -->
    <div style="margin-bottom: 25px;">
      <button class="btn-main" id="masterBtn" onclick="toggleAll()">Start Alle Geluiden</button>
    </div>

    <!-- Geluiden Grid (zonder sunny day) -->
    <div class="grid">
      <div class="card">
        <span class="card-title">Barista</span>
        <div class="slider-container">
          <input type="range" id="vol-barista" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('barista', this.value)">
        </div>
        <audio id="audio-barista" src="barista-eli.mp3" loop></audio>
      </div>

      <div class="card">
        <span class="card-title">Customers</span>
        <div class="slider-container">
          <input type="range" id="vol-customers" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('customers', this.value)">
        </div>
        <audio id="audio-customers" src="interior.mp3" loop></audio>
      </div>

      <div class="card">
        <span class="card-title">Machinery</span>
        <div class="slider-container">
          <input type="range" id="vol-machinery" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('machinery', this.value)">
        </div>
        <audio id="audio-machinery" src="96906__ohrwurm__espresso-machine.wav" loop></audio>
      </div>

      <div class="card">
        <span class="card-title">Rainy day</span>
        <div class="slider-container">
          <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('rain', this.value)">
        </div>
        <audio id="audio-rain" src="rain.mp3" loop></audio>
      </div>

      <div class="card">
        <span class="card-title">Kopjes</span>
        <div class="slider-container">
          <input type="range" id="vol-cups" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('cups', this.value)">
        </div>
        <audio id="audio-cups" src="coffeecups.mp3" loop></audio>
      </div>

      <div class="card">
        <span class="card-title">Preparing drinks</span>
        <div class="slider-container">
          <input type="range" id="vol-drinks" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('drinks', this.value)">
        </div>
        <audio id="audio-drinks" src="makingdrinks.mp3" loop></audio>
      </div>
    </div>
  </div>

  <script>
    // --- AUDIO BEHEER ---
    const audioElements = {
      barista: document.getElementById('audio-barista'),
      customers: document.getElementById('audio-customers'),
      machinery: document.getElementById('audio-machinery'),
      rain: document.getElementById('audio-rain'),
      cups: document.getElementById('audio-cups'),
      drinks: document.getElementById('audio-drinks')
    };

    let isPlaying = false;

    function toggleAll() {
      const masterBtn = document.getElementById('masterBtn');
      if (!isPlaying) {
        Object.keys(audioElements).forEach(key => {
          const audio = audioElements[key];
          audio.volume = document.getElementById(`vol-${key}`).value;
          audio.play().catch(e => console.log("Audio fout:", e));
        });
        isPlaying = true;
        masterBtn.innerText = "Pauzeer Alle Geluiden";
      } else {
        Object.values(audioElements).forEach(audio => audio.pause());
        isPlaying = false;
        masterBtn.innerText = "Start Alle Geluiden";
      }
    }

    function setVolume(soundKey, value) {
      if (audioElements[soundKey]) audioElements[soundKey].volume = value;
    }

    // --- TIMER & BLADEREN SYSTEEM ---
    let timerDuration = 25 * 60;
    let timeLeft = timerDuration;
    let timerInterval = null;

    function updateTimerDisplay() {
      const hours = Math.floor(timeLeft / 3600);
      const minutes = Math.floor((timeLeft % 3600) / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timerDisplay').innerText = 
        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function setCustomTimer() {
      const h = parseInt(document.getElementById('inputHours').value) || 0;
      const m = parseInt(document.getElementById('inputMinutes').value) || 0;
      const s = parseInt(document.getElementById('inputSeconds').value) || 0;
      timerDuration = (h * 3600) + (m * 60) + s;
      resetTimer();
    }

    function toggleTimer() {
      const btn = document.getElementById('timerToggleBtn');
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.innerText = "Start Timer";
      } else {
        if (timeLeft <= 0) return;
        btn.innerText = "Pauzeer Timer";
        startLeaves();
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.innerText = "Start Timer";
            stopLeaves(); // Bladeren stoppen wanneer de timer afgelopen is
            alert("Timer is afgelopen!");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById('timerToggleBtn').innerText = "Start Timer";
      }
      timeLeft = timerDuration;
      updateTimerDisplay();
      startLeaves();
    }

    // --- VALLENDE BLADEREN BEHEER ---
    function startLeaves() {
      const leafContainer = document.getElementById('leaf-container');
      leafContainer.innerHTML = '';
      const leafIcons = ['🍂', '🍁', '🍃'];
      for (let i = 0; i < 18; i++) {
        const leaf = document.createElement('div');
        leaf.classList.add('leaf');
        leaf.innerText = leafIcons[Math.floor(Math.random() * leafIcons.length)];
        leaf.style.left = `${Math.random() * 100}%`;
        leaf.style.animationDuration = `${5 + Math.random() * 7}s`;
        leaf.style.animationDelay = `${Math.random() * 5}s`;
        leaf.style.fontSize = `${1 + Math.random() * 1.2}rem`;
        leafContainer.appendChild(leaf);
      }
    }

    function stopLeaves() {
      document.getElementById('leaf-container').innerHTML = '';
    }

    // Initialiseren
    startLeaves();
    updateTimerDisplay();
  </script>
</body>
</html>
