<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Achtergrondruis Mixer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5e6d3;
      background-image: radial-gradient(#ead3bb 15%, transparent 16%), radial-gradient(#f5e6d3 15%, transparent 16%);
      background-size: 60px 60px;
      font-family: 'Segoe UI', Georgia, serif;
      height: 100vh;
      color: #3d2314;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    /* Canvas voor animatie */
    #leaves-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Layout (Spotify | Timer | Mixer) */
    .main-layout {
      display: grid;
      grid-template-columns: 300px 1fr 340px;
      gap: 20px;
      width: 100%;
      max-width: 1280px;
      height: calc(100vh - 40px);
      z-index: 10;
      position: relative;
      align-items: start;
    }

    /* Spotify Card */
    .spotify-card {
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.12);
    }

    /* Timer Card */
    .center-panel {
      display: flex;
      justify-content: center;
    }

    .timer-card {
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 15px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .timer-display {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }

    .timer-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-input {
      width: 45px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #c09f80;
      background: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      text-align: center;
      font-weight: bold;
      color: #3d2314;
    }

    .btn {
      background: #8c4320;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #703317;
    }

    .btn-secondary {
      background: rgba(61, 35, 20, 0.15);
      color: #3d2314;
    }

    /* Geluidsmixer */
    .mixer-container {
      background: rgba(255, 248, 240, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 15px;
      width: 100%;
      max-height: calc(100vh - 50px);
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mixer-header {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 5px;
      border-bottom: 2px solid rgba(140, 67, 32, 0.2);
      padding-bottom: 8px;
    }

    .sound-track {
      background: rgba(255, 255, 255, 0.5);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .track-header {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Vernieuwde Play Knop */
    .play-btn {
      background: #8c4320;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .play-btn:hover {
      background: #703317;
      transform: scale(1.05);
    }
    
    .play-btn.active {
      background: #3d2314; /* Donkerder als hij afspeelt */
    }

    .volume-icon {
      font-size: 1rem;
    }

    /* Volume Slider */
    .slider {
      flex-grow: 1;
      height: 6px;
      appearance: none;
      background: rgba(140, 67, 32, 0.3);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #8c4320;
      cursor: pointer;
    }

    /* Status Bar Rechts onderin */
    .status-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 15px rgba(61, 35, 20, 0.1);
    }

  </style>
</head>
<body>

  <!-- Canvas voor Bladeren -->
  <canvas id="leaves-canvas"></canvas>

  <div class="main-layout">
    
    <!-- Linkerkolom: Spotify -->
    <div class="spotify-card">
      <iframe 
        style="border-radius:14px;" 
        src="https://open.spotify.com/embed/playlist/7B96Vh6gmhWmGTRzZDMpxd?utm_source=generator&theme=0" 
        width="100%" 
        height="352" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </div>

    <!-- Middenkolom: Timer -->
    <div class="center-panel">
      <div class="timer-card">
        <div class="timer-display" id="timer">00:00</div>
        <div class="timer-controls">
          <input type="number" id="hours-input" class="timer-input" min="0" max="24" value="0">
          <span style="font-size: 0.8rem; font-weight: 600;">uur</span>
          <input type="number" id="minutes-input" class="timer-input" min="0" max="59" value="5">
          <span style="font-size: 0.8rem; font-weight: 600;">min</span>
          <button class="btn" id="start-btn">Start</button>
          <button class="btn btn-secondary" id="reset-btn">Reset</button>
        </div>
      </div>
    </div>

    <!-- Rechterkolom: Geluidsmixer -->
    <div class="mixer-container">
      <div class="mixer-header">Achtergrondgeluiden</div>

      <div class="sound-track" data-src="barista_eli.mp3">
        <div class="track-header">👤 Barista geluiden</div>
        <div class="controls-row">
          <button class="play-btn">▶</button>
          <span class="volume-icon">🔉</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
      </div>

      <div class="sound-track" data-src="making_drinks.mp3">
        <div class="track-header">☕ Koffie voorbereiden</div>
        <div class="controls-row">
          <button class="play-btn">▶</button>
          <span class="volume-icon">🔉</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
      </div>

      <div class="sound-track" data-src="coffeecups.mp3">
        <div class="track-header">🍽 Rammelende kopjes</div>
        <div class="controls-row">
          <button class="play-btn">▶</button>
          <span class="volume-icon">🔉</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
      </div>

      <div class="sound-track" data-src="interior.mp3">
        <div class="track-header">👥 Andere klanten</div>
        <div class="controls-row">
          <button class="play-btn">▶</button>
          <span class="volume-icon">🔉</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
      </div>

      <div class="sound-track" data-src="espresso_machine.mp3">
        <div class="track-header">⚙ Espressomachine</div>
        <div class="controls-row">
          <button class="play-btn">▶</button>
          <span class="volume-icon">🔉</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
      </div>

      <div class="sound-track" data-src="rain.mp3">
        <div class="track-header">🌧 Regen tegen het raam</div>
        <div class="controls-row">
          <button class="play-btn">▶</button>
          <span class="volume-icon">🔉</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
      </div>

      <div class="sound-track" data-src="fireplace.mp3">
        <div class="track-header">🔥 Open haard</div>
        <div class="controls-row">
          <button class="play-btn">▶</button>
          <span class="volume-icon">🔉</span>
          <input type="range" class="slider volume-slider" min="0" max="100" value="50">
        </div>
      </div>

    </div>
  </div>

  <!-- Status Bar Rechts onderin -->
  <div class="status-bar">
    🍂 Stapel vol: <span id="leaf-count">0</span>%
  </div>

  <script>
    // --- 1. Audio Logica (Nu simpel, robuust en betrouwbaar) ---
    document.querySelectorAll('.sound-track').forEach(track => {
      const src = track.getAttribute('data-src');
      const audio = new Audio(src);
      audio.loop = true; // Zorg dat het geluid zich blijft herhalen

      const playBtn = track.querySelector('.play-btn');
      const volSlider = track.querySelector('.volume-slider');

      // Stel het standaard volume in op basis van de slider
      audio.volume = volSlider.value / 100;

      // Play/Pauze knop logica
      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = '⏸';
            playBtn.classList.add('active');
          }).catch(err => {
            // Als het bestand niet bestaat, waarschuw de gebruiker!
            console.error(err);
            alert(`Fout bij afspelen! Zorg ervoor dat het audiobestand "${src}" in dezelfde map staat als dit bestand.`);
          });
        } else {
          audio.pause();
          playBtn.textContent = '▶';
          playBtn.classList.remove('active');
        }
      });

      // Volume slider logica
      volSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value / 100;
      });
    });

    // --- 2. Timer Logica ---
// --- 2. Timer Logica ---
    let totalTime = 300;
    let timeRemaining = totalTime;
    let timerInterval = null;
    let isRunning = false;

    // Alarmgeluid instellen
    const alarmAudio = new Audio('alarm.mp3');

    const timerElement = document.getElementById('timer');
    const hoursInput = document.getElementById('hours-input');
    const minutesInput = document.getElementById('minutes-input');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const leafCountElement = document.getElementById('leaf-count');

    function updateTimerDisplay() {
      const hrs = Math.floor(timeRemaining / 3600).toString().padStart(2, '0');
      const mins = Math.floor((timeRemaining % 3600) / 60).toString().padStart(2, '0');
      const secs = (timeRemaining % 60).toString().padStart(2, '0');
      
      if (Math.floor(timeRemaining / 3600) > 0) {
        timerElement.textContent = `${hrs}:${mins}:${secs}`;
      } else {
        timerElement.textContent = `${mins}:${secs}`;
      }
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Start';
        return;
      }

      if (timeRemaining <= 0) resetTimer();

      isRunning = true;
      startBtn.textContent = 'Pauze';

      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';

          // Speel het geluid af als de timer 00:00 bereikt
          alarmAudio.play().catch(err => {
            console.error("Kon het alarm niet afspelen:", err);
          });
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = 'Start';
      
      const inputHrs = parseInt(hoursInput.value) || 0;
      const inputMins = parseInt(minutesInput.value) || 0;
      
      totalTime = (inputHrs * 3600) + (inputMins * 60);

      if (totalTime <= 0) {
        totalTime = 60;
        hoursInput.value = 0;
        minutesInput.value = 1;
      }

      timeRemaining = totalTime;
      updateTimerDisplay();
    }

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);
    hoursInput.addEventListener('change', resetTimer);
    minutesInput.addEventListener('change', resetTimer);

    // --- 3. Canvas Vallende & Opstapelende Bladeren Animatie ---
    const canvas = document.getElementById('leaves-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const leafColors = ['#d8572a', '#e88a1a', '#c0392b', '#f39c12', '#a04000', '#7e5109', '#b33e10', '#8c3511'];
    const leaves = [];
    const MAX_LEAVES = 80;

    for (let i = 0; i < MAX_LEAVES; i++) {
      leaves.push({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 14 + 10,
        speedY: Math.random() * 1.5 + 0.8,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 2.5,
        color: leafColors[Math.floor(Math.random() * leafColors.length)],
        type: Math.floor(Math.random() * 2)
      });
    }

    const pileLeaves = [];
    const PILE_LEAF_COUNT = 3500;
    for (let i = 0; i < PILE_LEAF_COUNT; i++) {
      pileLeaves.push({
        xRel: Math.random(),
        yRel: Math.random(), 
        size: Math.random() * 22 + 14,
        angle: Math.random() * 360,
        color: leafColors[Math.floor(Math.random() * leafColors.length)],
        type: Math.floor(Math.random() * 2)
      });
    }

    function drawLeaf(x, y, size, angle, color, type) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((angle * Math.PI) / 180);
      ctx.fillStyle = color;
      ctx.beginPath();
      
      if (type === 1) {
        ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
        ctx.arc(size / 3, -size / 3, size / 3, 0, Math.PI * 2);
        ctx.arc(-size / 3, -size / 3, size / 3, 0, Math.PI * 2);
      } else {
        ctx.ellipse(0, 0, size, size / 2, 0, 0, Math.PI * 2);
      }
      
      ctx.fill();

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-size / 2, 0);
      ctx.lineTo(size / 2, 0);
      ctx.stroke();

      ctx.restore();
    }

    function updateAnimation() {
      ctx.clearRect(0, 0, width, height);

      const progress = 1 - (timeRemaining / totalTime); 
      leafCountElement.textContent = Math.round(progress * 100);

      pileLeaves.forEach(pLeaf => {
        if (pLeaf.yRel <= progress) {
          const px = pLeaf.xRel * width;
          const py = height - (pLeaf.yRel * height);
          drawLeaf(px, py, pLeaf.size, pLeaf.angle, pLeaf.color, pLeaf.type);
        }
      });

      leaves.forEach(leaf => {
        if (isRunning && timeRemaining > 0) {
          leaf.y += leaf.speedY;
          leaf.x += Math.sin(leaf.y / 25) * 1.2;
          leaf.angle += leaf.spin;

          const currentPileTop = height - (progress * height);
          if (leaf.y >= currentPileTop) {
            leaf.y = -20;
            leaf.x = Math.random() * width;
          }
        }
        drawLeaf(leaf.x, leaf.y, leaf.size, leaf.angle, leaf.color, leaf.type);
      });

      requestAnimationFrame(updateAnimation);
    }

    resetTimer();
    updateAnimation();
  </script>
</body>
</html>
