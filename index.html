<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Achtergrondruis Mixer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5e6d3;
      background-image: radial-gradient(#ead3bb 15%, transparent 16%), radial-gradient(#f5e6d3 15%, transparent 16%);
      background-size: 60px 60px;
      font-family: 'Segoe UI', Georgia, serif;
      height: 100vh;
      color: #3d2314;
      overflow: hidden; /* Voorkomt scrollen */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    /* 1. Canvas voor vallende en opstapelende bladeren */
    #leaves-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 2. Grid-indeling: Drie kolommen (Spotify | Timer | Geluiden) */
    .main-layout {
      display: grid;
      grid-template-columns: 300px 1fr 320px;
      gap: 20px;
      width: 100%;
      max-width: 1280px;
      height: calc(100vh - 40px);
      z-index: 10;
      position: relative;
      align-items: start;
    }

    /* Links: Spotify Card */
    .spotify-card {
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.12);
    }

    /* Midden: Timer Card */
    .center-panel {
      display: flex;
      justify-content: center;
    }

    .timer-card {
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 15px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .timer-display {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }

    .timer-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timer-input {
      width: 45px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #c09f80;
      background: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      text-align: center;
      font-weight: bold;
      color: #3d2314;
    }

    .btn {
      background: #8c4320;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #703317;
    }

    .btn-secondary {
      background: rgba(61, 35, 20, 0.15);
      color: #3d2314;
    }

    /* Rechts: Geluidsmixer (Transparante achtergrond met goed leesbare tekst) */
    .mixer-container {
      background: rgba(255, 248, 240, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 12px 15px;
      width: 100%;
      max-height: calc(100vh - 50px);
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(61, 35, 20, 0.08);
    }

    .mixer-container::-webkit-scrollbar {
      width: 4px;
    }
    .mixer-container::-webkit-scrollbar-thumb {
      background: rgba(61, 35, 20, 0.2);
      border-radius: 4px;
    }

    .top-options {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 0.75rem;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .sound-track {
      margin-bottom: 8px;
    }

    .track-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .play-btn {
      background: none;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      color: #3d2314;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-icon {
      font-size: 0.8rem;
      opacity: 0.8;
    }

    .slider {
      flex-grow: 1;
      accent-color: #3d2314;
      cursor: pointer;
    }

    .pan-row {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 0.65rem;
      font-weight: 600;
      opacity: 0.85;
    }

    .pan-row.active {
      display: flex;
    }

    /* 3. Status Bar Rechts onderin */
    .status-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 15px rgba(61, 35, 20, 0.1);
    }

    /* 4. To-Do Lijst Knop Linksonder */
    .todo-toggle-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: #3d2314;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(61, 35, 20, 0.1);
      transition: all 0.2s;
    }

    .todo-toggle-btn:hover {
      background: rgba(255, 248, 240, 0.95);
      transform: translateY(-2px);
    }

    /* 5. To-Do Pop-up Modal */
    .todo-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      max-height: 450px;
      background: rgba(255, 248, 240, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 20px;
      z-index: 100;
      box-shadow: 0 15px 35px rgba(61, 35, 20, 0.25);
      flex-direction: column;
      gap: 12px;
    }

    .todo-modal.active {
      display: flex;
    }

    .todo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #3d2314;
      border-bottom: 1px solid rgba(61, 35, 20, 0.1);
      padding-bottom: 8px;
    }

    .close-todo-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #3d2314;
      opacity: 0.6;
    }

    .close-todo-btn:hover {
      opacity: 1;
    }

    .todo-input-row {
      display: flex;
      gap: 8px;
    }

    .todo-input {
      flex-grow: 1;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #c09f80;
      background: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      color: #3d2314;
      outline: none;
    }

    .todo-list {
      list-style: none;
      overflow-y: auto;
      max-height: 280px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .todo-list::-webkit-scrollbar {
      width: 4px;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: rgba(61, 35, 20, 0.2);
      border-radius: 4px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      gap: 8px;
      transition: background 0.2s;
    }

    .todo-item.done span {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .todo-item span {
      cursor: pointer;
      flex-grow: 1;
      word-break: break-word;
    }

    .delete-todo-btn {
      background: none;
      border: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .delete-todo-btn:hover {
      opacity: 1;
    }
  </style>
</head>

    🍂 Stapel vol: <span id="leaf-count">0</span>%

  <script>
    // 1. Play / Pause knoppen toggle
    function togglePlay(btn) {
      btn.textContent = btn.textContent === '▶' ? '⏸' : '▶';
    }

    // 2. Pan Controls Toggle
    const panCheckbox = document.getElementById('toggle-pan');
    const panRows = document.querySelectorAll('.pan-row');

    panCheckbox.addEventListener('change', () => {
      panRows.forEach(row => {
        if (panCheckbox.checked) {
          row.classList.add('active');
        } else {
          row.classList.remove('active');
        }
      });
    });

    // 3. Timer Logica
    let totalTime = 300;
    let timeRemaining = totalTime;
    let timerInterval = null;
    let isRunning = false;

    const timerElement = document.getElementById('timer');
    const hoursInput = document.getElementById('hours-input');
    const minutesInput = document.getElementById('minutes-input');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const leafCountElement = document.getElementById('leaf-count');

    function updateTimerDisplay() {
      const hrs = Math.floor(timeRemaining / 3600).toString().padStart(2, '0');
      const mins = Math.floor((timeRemaining % 3600) / 60).toString().padStart(2, '0');
      const secs = (timeRemaining % 60).toString().padStart(2, '0');
      
      if (Math.floor(timeRemaining / 3600) > 0) {
        timerElement.textContent = `${hrs}:${mins}:${secs}`;
      } else {
        timerElement.textContent = `${mins}:${secs}`;
      }
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Start';
        return;
      }

      if (timeRemaining <= 0) resetTimer();

      isRunning = true;
      startBtn.textContent = 'Pauze';

      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = 'Start';
      
      const inputHrs = parseInt(hoursInput.value) || 0;
      const inputMins = parseInt(minutesInput.value) || 0;
      
      totalTime = (inputHrs * 3600) + (inputMins * 60);

      if (totalTime <= 0) {
        totalTime = 60;
        hoursInput.value = 0;
        minutesInput.value = 1;
      }

      timeRemaining = totalTime;
      updateTimerDisplay();
    }

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);
    hoursInput.addEventListener('change', resetTimer);
    minutesInput.addEventListener('change', resetTimer);

    // 4. To-Do Lijst Logica
    const todoToggleBtn = document.getElementById('todo-toggle-btn');
    const todoModal = document.getElementById('todo-modal');
    const closeTodoBtn = document.getElementById('close-todo-btn');
    const todoInput = document.getElementById('todo-input');
    const addTodoBtn = document.getElementById('add-todo-btn');
    const todoList = document.getElementById('todo-list');

    let todos = JSON.parse(localStorage.getItem('cafe_todos')) || [];

    function saveAndRenderTodos() {
      localStorage.setItem('cafe_todos', JSON.stringify(todos));
      todoList.innerHTML = '';
      
      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.done ? 'done' : ''}`;
        
        const span = document.createElement('span');
        span.textContent = todo.text;
        span.addEventListener('click', () => {
          todos[index].done = !todos[index].done;
          saveAndRenderTodos();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-todo-btn';
        deleteBtn.textContent = '🗑️';
        deleteBtn.addEventListener('click', () => {
          todos.splice(index, 1);
          saveAndRenderTodos();
        });

        li.appendChild(span);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });
    }

    function addTodo() {
      const text = todoInput.value.trim();
      if (text !== '') {
        todos.push({ text: text, done: false });
        todoInput.value = '';
        saveAndRenderTodos();
      }
    }

    todoToggleBtn.addEventListener('click', () => {
      todoModal.classList.toggle('active');
      if (todoModal.classList.contains('active')) {
        todoInput.focus();
      }
    });

    closeTodoBtn.addEventListener('click', () => {
      todoModal.classList.remove('active');
    });

    addTodoBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    saveAndRenderTodos();

    // 5. Canvas Vallende & Opstapelende Bladeren Animatie
    const canvas = document.getElementById('leaves-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const leafColors = ['#d8572a', '#e88a1a', '#c0392b', '#f39c12', '#a04000', '#7e5109', '#b33e10', '#8c3511'];
    const leaves = [];
    const MAX_LEAVES = 80;

    for (let i = 0; i < MAX_LEAVES; i++) {
      leaves.push({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 14 + 10,
        speedY: Math.random() * 1.5 + 0.8,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 2.5,
        color: leafColors[Math.floor(Math.random() * leafColors.length)],
        type: Math.floor(Math.random() * 2)
      });
    }

    // 3500 bladeren die het scherm 100% bedekken als de timer afloopt
    const pileLeaves = [];
    const PILE_LEAF_COUNT = 3500;
    for (let i = 0; i < PILE_LEAF_COUNT; i++) {
      pileLeaves.push({
        xRel: Math.random(),
        yRel: Math.random(), // Vertegenwoordigt de relatieve hoogte van onder (0) tot boven (1)
        size: Math.random() * 22 + 14,
        angle: Math.random() * 360,
        color: leafColors[Math.floor(Math.random() * leafColors.length)],
        type: Math.floor(Math.random() * 2)
      });
    }

    function drawLeaf(x, y, size, angle, color, type) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((angle * Math.PI) / 180);
      ctx.fillStyle = color;
      ctx.beginPath();
      
      if (type === 1) {
        ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
        ctx.arc(size / 3, -size / 3, size / 3, 0, Math.PI * 2);
        ctx.arc(-size / 3, -size / 3, size / 3, 0, Math.PI * 2);
      } else {
        ctx.ellipse(0, 0, size, size / 2, 0, 0, Math.PI * 2);
      }
      
      ctx.fill();

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-size / 2, 0);
      ctx.lineTo(size / 2, 0);
      ctx.stroke();

      ctx.restore();
    }

    function updateAnimation() {
      ctx.clearRect(0, 0, width, height);

      const progress = 1 - (timeRemaining / totalTime); // van 0 tot 1
      leafCountElement.textContent = Math.round(progress * 100);

      // Teken de bladerenstapel over het hele scherm naarmate de timer vordert
      pileLeaves.forEach(pLeaf => {
        if (pLeaf.yRel <= progress) {
          const px = pLeaf.xRel * width;
          const py = height - (pLeaf.yRel * height);
          drawLeaf(px, py, pLeaf.size, pLeaf.angle, pLeaf.color, pLeaf.type);
        }
      });

      // Vallende bladeren
      leaves.forEach(leaf => {
        if (isRunning && timeRemaining > 0) {
          leaf.y += leaf.speedY;
          leaf.x += Math.sin(leaf.y / 25) * 1.2;
          leaf.angle += leaf.spin;

          const currentPileTop = height - (progress * height);
          if (leaf.y >= currentPileTop) {
            leaf.y = -20;
            leaf.x = Math.random() * width;
          }
        }
        drawLeaf(leaf.x, leaf.y, leaf.size, leaf.angle, leaf.color, leaf.type);
      });

      requestAnimationFrame(updateAnimation);
    }

    resetTimer();
    updateAnimation();
  </script>
</body>
