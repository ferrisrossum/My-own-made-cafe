<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Achtergrondruis Mixer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7e7d6;
      font-family: 'Georgia', serif;
      color: #2b1a0e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .mixer-container {
      background: rgba(255, 248, 240, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(210, 180, 150, 0.5);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
.spotify-card {
  position: absolute;
  top: 30px;
  left: 30px;
  z-index: 10;
  width: 320px;
  padding: 8px;
  background: rgba(255, 248, 240, 0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(61, 35, 20, 0.1);
}
    /* Top opties */
    .top-options {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }

    .option-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* Geluidssporen */
    .sound-track {
      margin-bottom: 18px;
    }

    .track-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 1.05rem;
    }

    .play-btn {
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      color: #2b1a0e;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volume-icon {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .slider {
      flex-grow: 1;
      accent-color: #2b1a0e;
      cursor: pointer;
    }

    /* Pan controls (verborgen tot aangevinkt) */
    .pan-row {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .pan-row.active {
      display: flex;
    }
  </style>
</head>
<body>

  <div class="mixer-container">
    <!-- Top Opties -->
    <div class="top-options">
      <label class="option-label">
        <span>show pan controls</span>
        <input type="checkbox" id="toggle-pan">

      <label class="option-label">

      </div>
      <div class="controls-row">
        <span class="volume-icon">🔊</span>
        <input type="range" class="slider volume-slider" min="0" max="100" value="50">
      </div>
      <div class="pan-row">
        <span>L</span>
        <input type="range" class="slider pan-slider" min="-1" max="1" step="0.1" value="0">

  </div>

  <script>
    // Toggle play/pause knoppen
    function togglePlay(btn) {
      btn.textContent = btn.textContent === '▶' ? '⏸' : '▶';
    }

    // Toggle Pan Controls
    const panCheckbox = document.getElementById('toggle-pan');
    const panRows = document.querySelectorAll('.pan-row');

    panCheckbox.addEventListener('change', () => {
      panRows.forEach(row => {
        if (panCheckbox.checked) {
          row.classList.add('active');
        } else {
          row.classList.remove('active');
        }
      });
    });
  </script><!-- Strakke Spotify Speler Links Boven -->
