<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Achtergrondruis</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e5cdb3;
      background-image: radial-gradient(#eddcc9 15%, transparent 16%), radial-gradient(#e5cdb3 15%, transparent 16%);
      background-size: 60px 60px;
      font-family: 'Segoe UI', Georgia, serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
      color: #3d2314;
    }

    /* Canvas voor animatie */
    #leaves-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Centraal Timer Blok */
    .timer-card {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 248, 240, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 20px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(61, 35, 20, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .timer-display {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
    }

    /* Timer Controls */
    .timer-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .timer-input {
      width: 60px;
      padding: 6px 8px;
      border-radius: 10px;
      border: 1px solid #c09f80;
      background: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      text-align: center;
      font-weight: bold;
      color: #3d2314;
    }

    .btn {
      background: #8c4320;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #703317;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: rgba(61, 35, 20, 0.15);
      color: #3d2314;
    }

    .btn-secondary:hover {
      background: rgba(61, 35, 20, 0.25);
    }

    /* Geluidsspeler Paneel Links onderin */
    .sound-panel {
      position: absolute;
      bottom: 30px;
      left: 30px;
      z-index: 10;
      background: rgba(255, 248, 240, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 20px 24px;
      border-radius: 20px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(61, 35, 20, 0.1);
    }

    .sound-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sound-track:last-child {
      margin-bottom: 0;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      width: 140px;
    }

    .volume-slider {
      flex-grow: 1;
      margin: 0 10px;
      accent-color: #8c4320;
      cursor: pointer;
    }

    .play-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #3d2314;
      width: 25px;
    }

    /* Status Bar Rechts onderin */
    .status-bar {
      position: absolute;
      bottom: 25px;
      right: 30px;
      z-index: 10;
      font-size: 0.9rem;
      font-weight: 600;
      background: rgba(255, 248, 240, 0.65);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>

  <!-- Timer Card -->
  <div class="timer-card">
    <div class="timer-display" id="timer">05:00</div>
    
    <div class="timer-controls">
      <input type="number" id="minutes-input" class="timer-input" min="1" max="120" value="5">
      <span style="font-size: 0.85rem; font-weight: 600;">min</span>
      <button class="btn" id="start-btn">Start</button>
      <button class="btn btn-secondary" id="reset-btn">Reset</button>
    </div>
  </div>

  <!-- Sound Mixer -->
  <div class="sound-panel">
    <div class="sound-track">
      <div class="track-info">
        <span>👥</span>
        <span>Geroezemoes</span>
      </div>
      <input type="range" class="volume-slider" min="0" max="100" value="70">
      <button class="play-btn">⏸</button>
    </div>

    <div class="sound-track">
      <div class="track-info">
        <span>☕</span>
        <span>Koffieapparaat</span>
      </div>
      <input type="range" class="volume-slider" min="0" max="100" value="40">
      <button class="play-btn">▶</button>
    </div>

    <div class="sound-track">
      <div class="track-info">
        <span>🌧</span>
        <span>Regen</span>
      </div>
      <input type="range" class="volume-slider" min="0" max="100" value="60">
      <button class="play-btn">⏸</button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    🍂 Stapel vol: <span id="leaf-count">0</span>%
  </div>

  <!-- Canvas -->
  <canvas id="leaves-canvas"></canvas>

  <script>
    const canvas = document.getElementById('leaves-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Timer Variabelen
    let totalTime = 300; // Standaard 5 minuten
    let timeRemaining = totalTime;
    let timerInterval = null;
    let isRunning = false;

    const timerElement = document.getElementById('timer');
    const minutesInput = document.getElementById('minutes-input');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const leafCountElement = document.getElementById('leaf-count');

    function updateTimerDisplay() {
      const mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
      const secs = (timeRemaining % 60).toString().padStart(2, '0');
      timerElement.textContent = `${mins}:${secs}`;
    }

    function startTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Start';
        return;
      }

      if (timeRemaining <= 0) resetTimer();

      isRunning = true;
      startBtn.textContent = 'Pauze';

      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = 'Start';
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = 'Start';
      const inputMins = parseInt(minutesInput.value) || 5;
      totalTime = Math.max(1, inputMins) * 60;
      timeRemaining = totalTime;
      updateTimerDisplay();
    }

    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);
    minutesInput.addEventListener('change', resetTimer);

    // Bladeren Animatie Logica
    const leafColors = ['#d8572a', '#e88a1a', '#c0392b', '#f39c12', '#a04000', '#7e5109'];
    const leaves = [];
    const MAX_LEAVES = 80;

    for (let i = 0; i < MAX_LEAVES; i++) {
      leaves.push({
        x: Math.random() * width,
        y: Math.random() * height - height,
        size: Math.random() * 14 + 10,
        speedY: Math.random() * 1.5 + 0.8,
        angle: Math.random() * 360,
        spin: (Math.random() - 0.5) * 2.5,
        color: leafColors[Math.floor(Math.random() * leafColors.length)],
        type: Math.floor(Math.random() * 2)
      });
    }

    const pileLeaves = [];
    for (let i = 0; i < 300; i++) {
      pileLeaves.push({
        xRel: Math.random(),
        yRel: Math.random(),
        size: Math.random() * 16 + 12,
        angle: Math.random() * 360,
        color: leafColors[Math.floor(Math.random() * leafColors.length)]
      });
    }

    function drawLeaf(x, y, size, angle, color, type) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((angle * Math.PI) / 180);
      ctx.fillStyle = color;
      ctx.beginPath();
      
      if (type === 1) {
        ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
        ctx.arc(size / 3, -size / 3, size / 3, 0, Math.PI * 2);
        ctx.arc(-size / 3, -size / 3, size / 3, 0, Math.PI * 2);
      } else {
        ctx.ellipse(0, 0, size, size / 2, 0, 0, Math.PI * 2);
      }
      
      ctx.fill();
      ctx.restore();
    }

    function update() {
      ctx.clearRect(0, 0, width, height);

      const progress = 1 - (timeRemaining / totalTime);
      const pileHeight = progress * (height * 0.4);

      leafCountElement.textContent = Math.round(progress * 100);

      // Teken de stapel onderin
      if (pileHeight > 0) {
        pileLeaves.forEach(pLeaf => {
          const px = pLeaf.xRel * width;
          const py = height - (pLeaf.yRel * pileHeight);
          drawLeaf(px, py, pLeaf.size, pLeaf.angle, pLeaf.color, 0);
        });
      }

      // Teken en verplaats de vallende bladeren
      leaves.forEach(leaf => {
        if (isRunning && timeRemaining > 0) {
          leaf.y += leaf.speedY;
          leaf.x += Math.sin(leaf.y / 25) * 1.2;
          leaf.angle += leaf.spin;

          if (leaf.y >= height - pileHeight) {
            leaf.y = -20;
            leaf.x = Math.random() * width;
          }
        }
        drawLeaf(leaf.x, leaf.y, leaf.size, leaf.angle, leaf.color, leaf.type);
      });

      requestAnimationFrame(update);
    }

    // Speel/Pauze knoppen toggle
    document.querySelectorAll('.play-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.textContent = btn.textContent === '⏸' ? '▶' : '⏸';
      });
    });

    updateTimerDisplay();
    update();
  </script>
</body>
</html>
